<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>TrustBridge • Instagram‑style auth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #FFF9E6 0%, #FFF3D1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    /* soft animated background circles */
    .bg-ornament {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-ornament::before,
    .bg-ornament::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 209, 86, 0.3), transparent 70%);
      top: 10%;
      left: -5%;
      filter: blur(48px);
    }
    .bg-ornament::after {
      bottom: 5%;
      right: -5%;
      top: auto;
      left: auto;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(255, 185, 30, 0.25), transparent 70%);
    }

    /* main card – instagram style white card with big radius */
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #FFFFFF;
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.02);
      padding: 2rem 1.8rem 2rem 1.8rem;
      position: relative;
      z-index: 2;
      transition: transform 0.2s ease;
      animation: cardRise 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    @keyframes cardRise {
      0% { opacity: 0; transform: translateY(18px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* brand header */
    .brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .brand-icon {
      font-size: 2.7rem;
      font-weight: 800;
      background: linear-gradient(135deg, #F9A826, #F7C35C);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      display: inline-block;
    }
    .brand-name {
      font-size: 1.9rem;
      font-weight: 800;
      margin-top: 0.25rem;
      background: linear-gradient(135deg, #F9A826, #E5B02E);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .subhead {
      font-size: 0.8rem;
      color: #7E7C6E;
      margin-top: 0.25rem;
      font-weight: 500;
    }

    /* tabs – instagram style inline switch */
    .tabs {
      display: flex;
      gap: 0.5rem;
      background: #F5F5F0;
      border-radius: 60px;
      padding: 0.3rem;
      margin-bottom: 1.8rem;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 0.6rem 0;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.2s;
      color: #6B6A5E;
      background: transparent;
    }
    .tab.active {
      background: #FDCB3C;
      color: #1E1C13;
      box-shadow: 0 2px 6px rgba(253, 203, 60, 0.25);
    }

    /* form fields – big, clean, rounded */
    .form-group {
      margin-bottom: 1.1rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #514F43;
      margin-bottom: 0.4rem;
      letter-spacing: -0.2px;
    }
    input, select {
      width: 100%;
      background: #FEFCF5;
      border: 1.5px solid #E9E5D8;
      padding: 0.85rem 1rem;
      border-radius: 18px;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.2s;
      color: #1E1C13;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #FDCB3C;
      box-shadow: 0 0 0 3px rgba(253, 203, 60, 0.2);
      background: #FFFFFF;
    }

    /* role toggles (buyer / seller) */
    .role-group {
      display: flex;
      gap: 0.7rem;
    }
    .role-box {
      flex: 1;
      padding: 0.8rem 0;
      border-radius: 20px;
      border: 1.5px solid #E9E5D8;
      background: #FEFCF5;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.2s;
      color: #5C5A4E;
    }
    .role-box.active {
      border-color: #FDCB3C;
      background: #FFF8E7;
      color: #C27E0E;
      box-shadow: 0 2px 6px rgba(253, 203, 60, 0.2);
    }

    /* primary button – yellow/black instagram style */
    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 32px;
      padding: 0.9rem;
      margin-top: 0.6rem;
      font-weight: 700;
      font-size: 0.95rem;
      background: #FDCB3C;
      color: #1E1C13;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .submit-btn:hover {
      background: #F9BC1C;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(253, 203, 60, 0.35);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top: 2px solid #1E1C13;
      border-radius: 50%;
      display: none;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 1.5rem 0 1rem;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: #EBE7DC;
    }
    .divider span {
      font-size: 0.7rem;
      font-weight: 600;
      color: #A6A291;
    }

    /* google button – outline style */
    .google-btn {
      width: 100%;
      padding: 0.8rem;
      border-radius: 32px;
      background: #FFFFFF;
      border: 1.5px solid #EBE7DC;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      color: #3E3C32;
    }
    .google-btn:hover {
      background: #FEF7E9;
      border-color: #FDCB3C;
      transform: scale(0.99);
    }

    .forgot-link {
      text-align: right;
      margin-top: -0.4rem;
      margin-bottom: 1rem;
    }
    .forgot-link a {
      font-size: 0.7rem;
      font-weight: 600;
      color: #B87C10;
      text-decoration: none;
    }
    .forgot-link a:hover {
      text-decoration: underline;
    }

    /* message boxes */
    .msg-box {
      display: none;
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      animation: fadeMsg 0.2s ease;
    }
    @keyframes fadeMsg {
      from { opacity: 0; transform: translateY(-5px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .msg-error {
      background: #FFF2F0;
      border-left: 4px solid #E64C2E;
      color: #AA3A20;
    }
    .msg-success {
      background: #F0F9EC;
      border-left: 4px solid #89D448;
      color: #357A1C;
    }

    .footer-note {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: #A6A291;
    }
    .footer-note a {
      color: #C27E0E;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-note a:hover {
      text-decoration: underline;
    }

    /* for seller extra fields smooth */
    #sellerExtra {
      transition: all 0.2s;
    }

    @media (max-width: 500px) {
      .auth-card { padding: 1.5rem; }
      .role-group { flex-direction: column; gap: 0.5rem; }
      .role-box { padding: 0.7rem; }
    }
  </style>
</head>
<body>
<div class="bg-ornament"></div>
<div class="auth-card">
  <div class="brand">
    <div class="brand-icon">✦</div>
    <div class="brand-name">TrustBridge</div>
    <div class="subhead">secure escrow • global trade</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="switchTab('login')">Log in</div>
    <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign up</div>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="hello@trustbridge.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="forgot-link"><a href="#" id="forgotLink">Forgot password?</a></div>
    <button class="submit-btn" id="loginBtn">
      <div class="spinner" id="loginSpinner"></div>
      <span id="loginBtnText">Log in →</span>
    </button>
    <div class="divider"><div class="divider-line"></div><span>OR</span><div class="divider-line"></div></div>
    <button class="google-btn" id="googleLoginBtn">🔐 Continue with Google</button>
    <div id="loginMsg" class="msg-box"></div>
  </div>

  <!-- SIGNUP FORM -->
  <div id="signupForm" style="display: none;">
    <div class="form-group">
      <label>I'm a</label>
      <div class="role-group">
        <div class="role-box active" id="roleBuyer" onclick="setRole('buyer')">🛒 Buyer</div>
        <div class="role-box" id="roleSeller" onclick="setRole('seller')">📦 Seller</div>
      </div>
    </div>
    <div class="form-group">
      <label>Full name</label>
      <input type="text" id="signupName" placeholder="Shyaka Dieu Merci">
    </div>
    <div id="sellerExtra" style="display: none;">
      <div class="form-group">
        <label>Business name</label>
        <input type="text" id="businessName" placeholder="Enterprise Ltd">
      </div>
      <div class="form-group">
        <label>Business category</label>
        <select id="businessCategory">
          <option value="">Select category</option>
          <option>Electronics</option>
          <option>Fashion & Apparel</option>
          <option>Luxury goods</option>
          <option>Tech & Software</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="contact@example.com">
    </div>
    <div class="form-group">
      <label>Phone number</label>
      <input type="tel" id="signupPhone" placeholder="+250798294571">
    </div>
    <div class="form-group">
      <label>Password (min 6 characters)</label>
      <input type="password" id="signupPassword" placeholder="••••••">
    </div>
    <div class="form-group">
      <label>Confirm password</label>
      <input type="password" id="signupConfirm" placeholder="••••••">
    </div>
    <button class="submit-btn" id="signupBtn">
      <div class="spinner" id="signupSpinner"></div>
      <span id="signupBtnText">Create account →</span>
    </button>
    <div class="divider"><div class="divider-line"></div><span>OR</span><div class="divider-line"></div></div>
    <button class="google-btn" id="googleSignupBtn">🌟 Sign up with Google</button>
    <div id="signupMsg" class="msg-box"></div>
  </div>
  <div class="footer-note">
    By continuing you agree to <a href="#">Terms</a> & <a href="#">Privacy</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA0mA2YjiIfHU7soCjzSkcddAgVaFE1UMY",
    authDomain: "trustbridge-a8ab2.firebaseapp.com",
    projectId: "trustbridge-a8ab2",
    storageBucket: "trustbridge-a8ab2.firebasestorage.app",
    messagingSenderId: "933754600933",
    appId: "1:933754600933:web:b4d5cdfd0b6adc9b11030c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let selectedRole = 'buyer';

  function getRedirectUrl(role = 'buyer') {
    const returnUrl = sessionStorage.getItem('redirectAfterLogin');
    if (returnUrl) {
      sessionStorage.removeItem('redirectAfterLogin');
      return returnUrl;
    }
    return role === 'seller' ? 'dashboard.html' : 'messages.html';
  }

  window.switchTab = function(tab) {
    const loginDiv = document.getElementById('loginForm');
    const signupDiv = document.getElementById('signupForm');
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    if (tab === 'login') {
      loginDiv.style.display = 'block';
      signupDiv.style.display = 'none';
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
    } else {
      loginDiv.style.display = 'none';
      signupDiv.style.display = 'block';
      loginTab.classList.remove('active');
      signupTab.classList.add('active');
    }
    clearMessages();
  };

  window.setRole = function(role) {
    selectedRole = role;
    const buyerBox = document.getElementById('roleBuyer');
    const sellerBox = document.getElementById('roleSeller');
    const sellerExtra = document.getElementById('sellerExtra');
    if (role === 'buyer') {
      buyerBox.classList.add('active');
      sellerBox.classList.remove('active');
      sellerExtra.style.display = 'none';
    } else {
      buyerBox.classList.remove('active');
      sellerBox.classList.add('active');
      sellerExtra.style.display = 'block';
    }
  };

  function clearMessages() {
    ['loginMsg', 'signupMsg'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.style.display = 'none'; el.textContent = ''; }
    });
  }
  function showMsg(id, msg, type = 'error') {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.className = `msg-box msg-${type}`;
    el.style.display = 'block';
  }
  function setLoading(btnId, spinnerId, textId, loading) {
    const btn = document.getElementById(btnId);
    const spinner = document.getElementById(spinnerId);
    const textSpan = document.getElementById(textId);
    if (btn) btn.disabled = loading;
    if (spinner) spinner.style.display = loading ? 'block' : 'none';
    if (textSpan) textSpan.style.display = loading ? 'none' : 'inline';
  }
  function friendlyError(code) {
    const map = {
      'auth/email-already-in-use': 'Email already registered.',
      'auth/invalid-email': 'Invalid email address.',
      'auth/weak-password': 'Password must be at least 6 characters.',
      'auth/user-not-found': 'No account found with this email.',
      'auth/wrong-password': 'Incorrect password.',
      'auth/network-request-failed': 'Network issue. Please try again.',
      'auth/popup-closed-by-user': 'Google sign-in was cancelled.'
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  // LOGIN
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return showMsg('loginMsg', 'Please enter email and password.');
    setLoading('loginBtn', 'loginSpinner', 'loginBtnText', true);
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await getDoc(doc(db, 'users', cred.user.uid));
      const userData = snap.data();
      showMsg('loginMsg', `Welcome back, ${userData?.name || 'member'}! Redirecting...`, 'success');
      setTimeout(() => {
        window.location.href = getRedirectUrl(userData?.role || 'buyer');
      }, 1200);
    } catch (err) {
      showMsg('loginMsg', friendlyError(err.code));
    } finally {
      setLoading('loginBtn', 'loginSpinner', 'loginBtnText', false);
    }
  });

  // SIGNUP
  document.getElementById('signupBtn').addEventListener('click', async () => {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const phone = document.getElementById('signupPhone').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupConfirm').value;
    const businessName = document.getElementById('businessName').value.trim();
    const category = document.getElementById('businessCategory').value;

    if (!name || !email || !password) return showMsg('signupMsg', 'Please fill all required fields.');
    if (password !== confirm) return showMsg('signupMsg', 'Passwords do not match.');
    if (password.length < 6) return showMsg('signupMsg', 'Password must be at least 6 characters.');
    if (selectedRole === 'seller' && !businessName) return showMsg('signupMsg', 'Business name is required for sellers.');

    setLoading('signupBtn', 'signupSpinner', 'signupBtnText', true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: name });
      const userData = {
        uid: cred.user.uid,
        name, email, phone,
        role: selectedRole,
        businessName: selectedRole === 'seller' ? businessName : null,
        category: selectedRole === 'seller' ? category : null,
        createdAt: serverTimestamp(),
        status: selectedRole === 'seller' ? 'pending' : 'active',
        verified: false,
        online: true,
        followers: [],
        following: []
      };
      await setDoc(doc(db, 'users', cred.user.uid), userData);
      showMsg('signupMsg', 'Account created successfully! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = getRedirectUrl(selectedRole);
      }, 1500);
    } catch (err) {
      showMsg('signupMsg', friendlyError(err.code));
    } finally {
      setLoading('signupBtn', 'signupSpinner', 'signupBtnText', false);
    }
  });

  // GOOGLE AUTH
  async function googleSignIn(defaultRole = 'buyer') {
    const activeMsgId = document.getElementById('loginForm').style.display !== 'none' ? 'loginMsg' : 'signupMsg';
    try {
      const provider = new GoogleAuthProvider();
      const cred = await signInWithPopup(auth, provider);
      const userRef = doc(db, 'users', cred.user.uid);
      const snap = await getDoc(userRef);
      if (!snap.exists()) {
        await setDoc(userRef, {
          uid: cred.user.uid,
          name: cred.user.displayName,
          email: cred.user.email,
          avatar: cred.user.photoURL,
          role: defaultRole,
          createdAt: serverTimestamp(),
          verified: false,
          status: 'active',
          online: true,
          followers: [],
          following: []
        });
      }
      const existingRole = snap.exists() ? snap.data().role : defaultRole;
      showMsg(activeMsgId, 'Google authentication successful. Redirecting...', 'success');
      setTimeout(() => { window.location.href = getRedirectUrl(existingRole); }, 1000);
    } catch (err) {
      showMsg(activeMsgId, friendlyError(err.code));
    }
  }

  document.getElementById('googleLoginBtn').addEventListener('click', () => googleSignIn('buyer'));
  document.getElementById('googleSignupBtn').addEventListener('click', () => googleSignIn(selectedRole));

  // FORGOT PASSWORD
  document.getElementById('forgotLink').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) return showMsg('loginMsg', 'Enter your email address to reset password.');
    try {
      await sendPasswordResetEmail(auth, email);
      showMsg('loginMsg', 'Password reset email sent! Check your inbox.', 'success');
    } catch (err) {
      showMsg('loginMsg', friendlyError(err.code));
    }
  });

  // enter key shortcuts
  document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
  document.getElementById('signupConfirm').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('signupBtn').click(); });

  // if already logged in, redirect
  onAuthStateChanged(auth, (user) => {
    if (user && window.location.pathname.includes('login.html')) {
      (async () => {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const role = snap.exists() ? snap.data().role : 'buyer';
        window.location.href = getRedirectUrl(role);
      })();
    }
  });
</script>

<script>
  // Micro interactions: ripple effect for buttons
  function createRipple(event, element) {
    const circle = document.createElement('span');
    const diameter = Math.max(element.clientWidth, element.clientHeight);
    const radius = diameter / 2;
    const rect = element.getBoundingClientRect();
    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${event.clientX - rect.left - radius}px`;
    circle.style.top = `${event.clientY - rect.top - radius}px`;
    circle.classList.add('ripple-effect');
    circle.style.position = 'absolute';
    circle.style.background = 'radial-gradient(circle, rgba(0,0,0,0.15), rgba(253,203,60,0.4))';
    circle.style.borderRadius = '50%';
    circle.style.pointerEvents = 'none';
    circle.style.transform = 'scale(0)';
    circle.style.transition = 'transform 0.4s, opacity 0.5s';
    element.style.position = 'relative';
    element.style.overflow = 'hidden';
    element.appendChild(circle);
    requestAnimationFrame(() => {
      circle.style.transform = 'scale(5)';
      circle.style.opacity = '0';
    });
    setTimeout(() => circle.remove(), 500);
  }
  document.querySelectorAll('.submit-btn, .google-btn').forEach(btn => {
    btn.addEventListener('click', (e) => createRipple(e, btn));
  });
  const style = document.createElement('style');
  style.textContent = `.ripple-effect { position: absolute; border-radius: 50%; transform: scale(0); animation: rippleAnim 0.4s linear forwards; pointer-events: none; background: radial-gradient(circle, rgba(253,203,60,0.3), rgba(255,215,0,0.1)); } @keyframes rippleAnim { to { transform: scale(6); opacity: 0; } }`;
  document.head.appendChild(style);

  // subtle input animation
  const inputs = document.querySelectorAll('input, select');
  inputs.forEach(inp => {
    inp.addEventListener('focus', () => {
      inp.parentElement.classList.add('focused');
    });
    inp.addEventListener('blur', () => inp.parentElement.classList.remove('focused'));
  });
</script>
</body>
</html>
